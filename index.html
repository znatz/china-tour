<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国の旅 — 中国旅行アルバム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E6;
    --paper-deep:#EDE6D6;
    --ink:#211C16;
    --ink-soft:#5B534A;
    --red:#9E2B25;
    --red-deep:#7C1F1B;
    --gold:#AD8A3F;
    --line:#D9CFBA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  header{
    padding:72px 6vw 40px;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 92% 8%, rgba(158,43,37,0.07), transparent 45%),
      var(--paper);
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:.04em;
    color:var(--red);
    margin:0 0 14px;
  }
  h1{
    font-family:'Noto Serif SC',serif;
    font-weight:700;
    font-size:clamp(34px,6vw,64px);
    line-height:1.05;
    margin:0 0 10px;
    color:var(--ink);
  }
  h1 span{
    display:block;
    font-size:clamp(15px,1.6vw,19px);
    font-weight:400;
    color:var(--ink-soft);
    margin-top:10px;
    letter-spacing:.01em;
  }
  .stats{
    margin-top:28px;
    display:flex;
    gap:28px;
    flex-wrap:wrap;
  }
  .stat b{
    font-family:'Noto Serif SC',serif;
    font-size:26px;
    display:block;
    color:var(--red-deep);
  }
  .stat small{
    color:var(--ink-soft);
    font-size:12.5px;
  }

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:20px 6vw;
    flex-wrap:wrap;
  }
  .filters{display:flex;gap:8px;}
  .filters button{
    font-family:inherit;
    font-size:13px;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .filters button.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .play-all{
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    padding:9px 18px;
    border-radius:999px;
    border:1px solid var(--red);
    background:var(--red);
    color:var(--paper);
    cursor:pointer;
  }
  .play-all:hover{background:var(--red-deep);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:4px;
    padding:0 6vw 80px;
  }
  .cell{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    cursor:pointer;
    background:var(--paper-deep);
  }
  .cell img,.cell video{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s ease;
  }
  .cell:hover img,.cell:hover video{transform:scale(1.05);}
  .cell .badge{
    position:absolute;
    top:8px;right:8px;
    width:26px;height:26px;
    border-radius:50%;
    background:rgba(33,28,22,.55);
    display:flex;align-items:center;justify-content:center;
  }
  .cell .badge svg{width:11px;height:11px;fill:var(--paper);}
  .cell .idx{
    position:absolute;
    bottom:8px;left:8px;
    font-size:11px;
    color:rgba(245,241,230,.85);
    background:rgba(33,28,22,.45);
    padding:2px 7px;
    border-radius:999px;
  }

  /* Lightbox */
  .lightbox{
    position:fixed;inset:0;
    background:rgba(15,12,9,.97);
    display:none;
    z-index:100;
    flex-direction:column;
  }
  .lightbox.open{display:flex;}
  .lb-top{
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 24px;
    color:var(--paper);
    font-size:13px;
  }
  .lb-top .name{color:rgba(245,241,230,.6);}
  .lb-actions{display:flex;gap:10px;align-items:center;}
  .lb-btn{
    background:none;border:1px solid rgba(245,241,230,.35);
    color:var(--paper);
    border-radius:999px;
    padding:7px 16px;
    font-family:inherit;font-size:12.5px;
    cursor:pointer;
  }
  .lb-btn.active{background:var(--red);border-color:var(--red);}
  .lb-close{
    background:none;border:none;color:var(--paper);
    font-size:26px;line-height:1;cursor:pointer;padding:4px 8px;
  }
  .lb-stage{
    flex:1;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    padding:0 70px 24px;
    min-height:0;
  }
  .lb-stage img,.lb-stage video{
    max-width:100%;max-height:100%;
    object-fit:contain;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .lb-nav{
    position:absolute;top:0;bottom:24px;
    width:70px;
    background:none;border:none;
    color:rgba(245,241,230,.55);
    font-size:30px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .lb-nav:hover{color:var(--paper);}
  .lb-prev{left:0;}
  .lb-next{right:0;}
  .lb-caption{
    text-align:center;
    color:rgba(245,241,230,.5);
    font-size:12px;
    padding-bottom:18px;
  }

  @media(max-width:640px){
    .lb-stage{padding:0 14px 14px;}
    .lb-nav{width:44px;font-size:22px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">旅行記録</p>
  <h1>中国の旅<span>中国旅行の写真と動画の記録</span></h1>
  <div class="stats">
    <div class="stat"><b id="statPhotos">0</b><small>写真</small></div>
    <div class="stat"><b id="statVideos">0</b><small>動画</small></div>
    <div class="stat"><b id="statTotal">0</b><small>合計</small></div>
  </div>
</header>

<div class="toolbar">
  <div class="filters">
    <button class="active" data-filter="all">すべて</button>
    <button data-filter="photo">写真</button>
    <button data-filter="video">動画</button>
  </div>
  <button class="play-all" id="playAllBtn">▶ スライドショー再生</button>
</div>

<div class="grid" id="grid"></div>

<div class="lightbox" id="lightbox">
  <div class="lb-top">
    <div class="name" id="lbCounter"></div>
    <div class="lb-actions">
      <button class="lb-btn" id="lbSlideshow">▶ スライドショー</button>
      <button class="lb-close" id="lbClose">&times;</button>
    </div>
  </div>
  <div class="lb-stage">
    <button class="lb-nav lb-prev" id="lbPrev">&#8249;</button>
    <div id="lbMedia"></div>
    <button class="lb-nav lb-next" id="lbNext">&#8250;</button>
  </div>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script>
// ---- configuration -------------------------------------------------
// Folder (relative to this file) to scan for photos/videos.
const MEDIA_DIR = 'photos';
// Leave these null to auto-detect from the page URL (works for both
// project pages: USER.github.io/REPO/ and user pages: USER.github.io/).
// Set them manually only if auto-detection doesn't match your repo.
const REPO_OWNER = null;
const REPO_NAME  = null;
const REPO_BRANCH = 'main';

const PHOTO_EXT = ['jpg','jpeg','png','gif','webp','bmp'];
const VIDEO_EXT = ['mp4','mov','webm','m4v'];

function detectRepoInfo(){
  const host = location.hostname; // e.g. username.github.io
  const owner = REPO_OWNER || host.split('.')[0];
  const pathParts = location.pathname.split('/').filter(Boolean);
  // Project page: username.github.io/REPO/... -> pathParts[0] is the repo.
  // User/org page: username.github.io/... -> the repo IS the host itself.
  const repo = REPO_NAME || (pathParts.length ? pathParts[0] : host);
  return { owner, repo };
}

async function fetchMediaList(){
  const { owner, repo } = detectRepoInfo();
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${MEDIA_DIR}?ref=${REPO_BRANCH}`;
  const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
  if(!res.ok){
    throw new Error(`GitHub API ${res.status}: ${res.statusText}`);
  }
  const entries = await res.json();
  const items = entries
    .filter(e => e.type === 'file')
    .map(e => {
      const ext = (e.name.split('.').pop() || '').toLowerCase();
      let kind = null;
      if(PHOTO_EXT.includes(ext)) kind = 'photo';
      else if(VIDEO_EXT.includes(ext)) kind = 'video';
      return kind ? { src: `${MEDIA_DIR}/${e.name}`, type: kind, name: e.name } : null;
    })
    .filter(Boolean)
    .sort((a,b)=> a.name.localeCompare(b.name, undefined, {numeric:true}));
  return items;
}

let ITEMS = [];

const grid = document.getElementById('grid');
const lightbox = document.getElementById('lightbox');
const lbMedia = document.getElementById('lbMedia');
const lbCounter = document.getElementById('lbCounter');
const lbCaption = document.getElementById('lbCaption');
const lbSlideshowBtn = document.getElementById('lbSlideshow');
const playAllBtn = document.getElementById('playAllBtn');

let filtered = [];
let current = 0;
let slideshowTimer = null;
const SLIDE_MS = 3500;

function updateStats(){
  document.getElementById('statPhotos').textContent = ITEMS.filter(i=>i.type==='photo').length;
  document.getElementById('statVideos').textContent = ITEMS.filter(i=>i.type==='video').length;
  document.getElementById('statTotal').textContent = ITEMS.length;
}

function showGridMessage(text){
  grid.innerHTML = `<div style="grid-column:1/-1;padding:60px 0;text-align:center;color:var(--ink-soft);font-size:14px;">${text}</div>`;
}

async function init(){
  showGridMessage('読み込み中…');
  try{
    ITEMS = await fetchMediaList();
    updateStats();
    if(ITEMS.length === 0){
      showGridMessage(`「${MEDIA_DIR}」フォルダに写真・動画が見つかりませんでした。`);
      return;
    }
    setFilter('all');
  } catch(err){
    console.error(err);
    showGridMessage(
      '写真・動画の一覧を取得できませんでした。GitHub Pages 上で開いているか、' +
      'リポジトリが公開設定になっているかご確認ください。<br>' +
      '<span style="opacity:.6;font-size:12px;">' + err.message + '</span>'
    );
  }
}

function playIconSVG(){
  return '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
}

function renderGrid(){
  grid.innerHTML = '';
  filtered.forEach((item, i)=>{
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.addEventListener('click', ()=>openLightbox(i));
    if(item.type === 'photo'){
      const img = document.createElement('img');
      img.src = item.src;
      img.loading = 'lazy';
      img.alt = item.name;
      cell.appendChild(img);
    } else {
      const vid = document.createElement('video');
      vid.src = item.src;
      vid.preload = 'metadata';
      vid.muted = true;
      cell.appendChild(vid);
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.innerHTML = playIconSVG();
      cell.appendChild(badge);
    }
    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = i + 1;
    cell.appendChild(idx);
    grid.appendChild(cell);
  });
}

function setFilter(kind){
  document.querySelectorAll('.filters button').forEach(b=>{
    b.classList.toggle('active', b.dataset.filter === kind);
  });
  filtered = kind === 'all' ? ITEMS.slice() : ITEMS.filter(i=>i.type===kind);
  renderGrid();
}

document.querySelectorAll('.filters button').forEach(b=>{
  b.addEventListener('click', ()=>setFilter(b.dataset.filter));
});

function openLightbox(i){
  current = i;
  lightbox.classList.add('open');
  showMedia();
}

function closeLightbox(){
  lightbox.classList.remove('open');
  stopSlideshow();
}

function showMedia(){
  const item = filtered[current];
  lbMedia.innerHTML = '';
  if(item.type === 'photo'){
    const img = document.createElement('img');
    img.src = item.src;
    img.alt = item.name;
    lbMedia.appendChild(img);
  } else {
    const vid = document.createElement('video');
    vid.src = item.src;
    vid.controls = true;
    vid.autoplay = true;
    vid.addEventListener('ended', ()=>{ if(slideshowTimer) next(); });
    lbMedia.appendChild(vid);
  }
  lbCounter.textContent = (current + 1) + ' / ' + filtered.length;
  lbCaption.textContent = item.name;
}

function next(){
  current = (current + 1) % filtered.length;
  showMedia();
}
function prev(){
  current = (current - 1 + filtered.length) % filtered.length;
  showMedia();
}

function startSlideshow(){
  stopSlideshow();
  slideshowTimer = setInterval(()=>{
    const item = filtered[current];
    if(item.type === 'video') return; // wait for video 'ended' event
    next();
  }, SLIDE_MS);
  lbSlideshowBtn.classList.add('active');
  lbSlideshowBtn.textContent = '⏸ 一時停止';
}
function stopSlideshow(){
  if(slideshowTimer){ clearInterval(slideshowTimer); slideshowTimer = null; }
  lbSlideshowBtn.classList.remove('active');
  lbSlideshowBtn.textContent = '▶ スライドショー';
}
function toggleSlideshow(){
  if(slideshowTimer) stopSlideshow(); else startSlideshow();
}

document.getElementById('lbPrev').addEventListener('click', ()=>{ stopSlideshow(); prev(); });
document.getElementById('lbNext').addEventListener('click', ()=>{ stopSlideshow(); next(); });
document.getElementById('lbClose').addEventListener('click', closeLightbox);
lbSlideshowBtn.addEventListener('click', toggleSlideshow);
playAllBtn.addEventListener('click', ()=>{
  setFilter('all');
  openLightbox(0);
  startSlideshow();
});

lightbox.addEventListener('click', (e)=>{
  if(e.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', (e)=>{
  if(!lightbox.classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  else if(e.key === 'ArrowRight'){ stopSlideshow(); next(); }
  else if(e.key === 'ArrowLeft'){ stopSlideshow(); prev(); }
  else if(e.key === ' '){ e.preventDefault(); toggleSlideshow(); }
});

init();
</script>

</body>
</html>
